<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141833">
<meta name="description" content="개혁교회의 주일을 따라가며 배우는 영어 게임">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="주일 영어">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body><title>Lord's Day English</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&family=Jua&family=Spectral:ital,wght@0,500;1,500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: full-screen visual novel stage. Painted church backgrounds, waist-up character sprites,
   a glassy dialogue box pinned to the bottom, chunky game buttons, HUD across the top.
   Single committed look (night-glass UI over bright paintings), so one palette, explicit everywhere. */
:root{
  --ink:#141833; --glass:rgba(16,20,44,.86); --glass-2:rgba(255,255,255,.08); --line:rgba(255,255,255,.22);
  --text:#F7F5EF; --muted:#B8BED6; --paper:#FFFDF6; --paper-ink:#25231E;
  --sun:#FFC94D; --mint:#3FE0A8; --pink:#FF7FA8; --sky:#7FC8FF; --coral:#FF6B5E; --amber:#FFB547; --violet:#9D8CFF;
  --f-logo:"Fredoka","Jua",system-ui,sans-serif;
  --f-en:"Nunito","Segoe UI",system-ui,sans-serif;
  --f-ko:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-kd:"Jua","IBM Plex Sans KR","Malgun Gothic",sans-serif;
  --f-word:"Spectral",Georgia,"Times New Roman",serif;
  --gut:max(16px, env(safe-area-inset-left, 0px));
  --gutr:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:#0B0E20;color:var(--text);font-family:var(--f-ko);overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- stage ---------- */
#stage{position:relative;height:100%;width:100%;overflow:hidden;user-select:none;-webkit-user-select:none}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .9s ease;opacity:0}
.bg.on{opacity:1}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,14,32,.35) 0%,rgba(11,14,32,0) 22%,rgba(11,14,32,0) 55%,rgba(11,14,32,.55) 100%);pointer-events:none}
.sprite{position:absolute;bottom:0;height:86%;max-height:980px;width:auto;max-width:none;transform:translate(-50%,24px);opacity:0;
  transition:left .5s cubic-bezier(.2,.8,.2,1),opacity .4s,transform .4s,filter .3s;filter:brightness(.62) saturate(.85);pointer-events:none;
  -webkit-user-drag:none}
.sprite.in{opacity:1;transform:translate(-50%,0)}
.sprite.talk{filter:none;z-index:2}
.sprite.talk.hop{animation:hop .35s ease-out}
@keyframes hop{0%{transform:translate(-50%,0)}40%{transform:translate(-50%,-10px)}100%{transform:translate(-50%,0)}}

/* ---------- HUD ---------- */
.hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:var(--gut);right:var(--gutr);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;z-index:20;pointer-events:none}
.hud > *{pointer-events:auto}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--glass);border:2px solid var(--line);border-radius:999px;padding:6px 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chap b{font-family:var(--f-logo);font-weight:700;color:var(--sun);letter-spacing:.04em;font-size:.82rem}
.chap span{font-family:var(--f-kd);font-size:1.02rem}
.dots{display:flex;gap:5px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.25)}
.dots i.done{background:var(--mint)} .dots i.cur{background:var(--sun);box-shadow:0 0 0 3px rgba(255,201,77,.3)}
.right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.xp{min-width:150px;flex-direction:column;align-items:stretch;gap:3px;padding:6px 14px 8px;border-radius:16px}
.xp .top{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-logo);font-weight:600;font-size:.82rem}
.xp .top em{font-style:normal;color:var(--sun)}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--pink));border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.combo{font-family:var(--f-logo);font-weight:700;background:linear-gradient(90deg,#FF8A3D,var(--pink));color:#fff;border:0;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.ib{width:42px;height:42px;padding:0;justify-content:center;font-family:var(--f-logo);font-weight:700;font-size:.82rem;border-radius:14px}
.ib[aria-pressed="true"]{background:var(--sun);color:var(--ink);border-color:var(--sun)}
.ib svg{width:20px;height:20px}

/* ---------- dialogue ---------- */
.bottom{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:min(980px, calc(100% - var(--gut) - var(--gutr)));display:flex;flex-direction:column;gap:12px;z-index:10}
.choices{display:flex;flex-direction:column;gap:10px;align-items:stretch;max-width:760px;width:100%;margin:0 auto}
.choice{display:flex;gap:12px;align-items:center;text-align:left;background:#FFFFFF;color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:11px 16px;
  font-family:var(--f-en);font-weight:700;font-size:1.06rem;box-shadow:0 5px 0 var(--ink);transition:transform .1s, box-shadow .1s;animation:rise .3s ease-out both}
.choice:nth-child(2){animation-delay:.06s}.choice:nth-child(3){animation-delay:.12s}
.choice:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
.choice:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.choice:disabled{opacity:.45;cursor:default;transform:none;text-decoration:line-through}
.choice .k{flex:0 0 32px;height:32px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-logo);font-size:1rem;border:2px solid var(--ink)}
.choice:nth-child(1) .k{background:var(--pink)} .choice:nth-child(2) .k{background:var(--sun)} .choice:nth-child(3) .k{background:var(--mint)} .choice:nth-child(4) .k{background:var(--sky)}
.choice.partner{align-items:center}
.choice.partner img{width:52px;height:52px;object-fit:cover;object-position:top;border-radius:12px;border:2px solid var(--ink);background:#EEE}
.choice small{display:block;font-family:var(--f-ko);font-weight:500;font-size:.82rem;color:#4A4F6B}
@keyframes rise{from{transform:translateY(14px);opacity:0}}

.box{position:relative;background:var(--glass);border:2px solid var(--line);border-radius:22px;padding:22px 22px 18px;min-height:132px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 18px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:8px;cursor:pointer}
.tag{position:absolute;top:-17px;left:20px;background:var(--c,var(--sun));color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:2px 14px;font-family:var(--f-logo);font-weight:700;font-size:1rem;display:flex;gap:8px;align-items:baseline;box-shadow:0 3px 0 var(--ink)}
.tag small{font-family:var(--f-kd);font-weight:400;font-size:.82rem;opacity:.8}
.en{font-family:var(--f-en);font-weight:700;font-size:1.28rem;line-height:1.45;margin:0;min-height:1.45em;transition:filter .25s}
.en.word{font-family:var(--f-word);font-style:italic;font-weight:500;color:#FFE7A8;font-size:1.36rem}
.en.blur{filter:blur(7px)}
.ko{margin:0;color:var(--muted);font-size:.95rem;line-height:1.5}
.narr .en{display:none}
.narr .ko{color:var(--text);font-family:var(--f-kd);font-size:1.12rem;line-height:1.6}
.hint{position:absolute;right:18px;bottom:10px;color:var(--sun);font-size:.9rem;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mini{background:var(--glass-2);border:1.5px solid var(--line);border-radius:10px;padding:3px 10px;font-size:.84rem;color:var(--text)}
.mini:hover{border-color:var(--sun)}
.extra{display:flex;flex-direction:column;gap:10px;cursor:default}
.fb{display:flex;flex-direction:column;gap:4px;border-radius:14px;padding:10px 14px;background:rgba(255,255,255,.07);border:2px solid var(--fc);animation:rise .25s ease-out}
.fb .badge{align-self:flex-start;background:var(--fc);color:var(--ink);font-family:var(--f-logo);font-weight:700;border-radius:8px;padding:1px 10px;font-size:.9rem}
.fb p{margin:0;font-size:.95rem;line-height:1.5}
.fb.best{--fc:var(--mint)} .fb.ok{--fc:var(--amber)} .fb.odd{--fc:var(--coral)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gbtn{background:var(--sun);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:8px 18px;font-family:var(--f-logo);font-weight:700;font-size:1rem;box-shadow:0 4px 0 var(--ink);transition:transform .1s, box-shadow .1s}
.gbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.gbtn.mint{background:var(--mint)} .gbtn.ghost{background:#fff}
.gbtn:disabled{opacity:.5;cursor:default}
.field{flex:1 1 220px;min-width:0;background:rgba(255,255,255,.95);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:9px 14px;font-family:var(--f-en);font-weight:700;font-size:1.05rem}
.field::placeholder{color:#7A7F99;font-weight:600}
.blankline{font-family:var(--f-en);font-weight:700;font-size:1.2rem;line-height:1.9}
.blankline input{width:7.5em;display:inline-block;text-align:center;padding:4px 8px;font-size:1.05rem;margin:0 4px}
.starters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.starters button{background:rgba(255,255,255,.92);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:5px 12px;font-family:var(--f-en);font-weight:700;font-size:.9rem;animation:rise .3s ease-out both}

/* ---------- floating ---------- */
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 12px);width:min(620px,100%);background:#FFFFFF;color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:10px 14px;box-shadow:0 5px 0 var(--ink);animation:rise .3s ease-out;z-index:3}
.toast b{font-family:var(--f-logo)} .toast .en2{font-family:var(--f-en);font-weight:800;font-size:1.05rem;color:#1C7A55}
.toast p{margin:2px 0 0;font-size:.88rem;color:#3E425C}
.xpfloat{position:absolute;z-index:40;font-family:var(--f-logo);font-weight:700;font-size:1.6rem;color:var(--sun);text-shadow:0 3px 0 var(--ink);pointer-events:none;animation:floatup 1.2s ease-out forwards}
@keyframes floatup{from{transform:translate(-50%,0) scale(.8);opacity:0}20%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}to{transform:translate(-50%,-90px) scale(1);opacity:0}}
.banner{position:absolute;inset:0;display:grid;place-items:center;z-index:50;background:radial-gradient(ellipse at center,rgba(11,14,32,.82),rgba(11,14,32,.94));animation:fadein .35s ease-out;cursor:pointer}
.banner .inner{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;padding:0 var(--gutr) 0 var(--gut)}
.banner .step{font-family:var(--f-logo);font-weight:700;color:var(--ink);background:var(--sun);border:3px solid var(--ink);border-radius:12px;padding:2px 14px;letter-spacing:.08em;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.banner h2{font-family:var(--f-kd);font-weight:400;font-size:clamp(2.4rem,9vw,4.6rem);margin:6px 0 0;line-height:1.1;animation:pop .55s .08s cubic-bezier(.3,1.6,.5,1) both;text-shadow:0 5px 0 rgba(0,0,0,.4)}
.banner p{font-family:var(--f-logo);font-weight:600;color:var(--muted);margin:0;font-size:1.1rem;animation:pop .5s .16s both}
.banner.level h2{color:var(--sun)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes fadein{from{opacity:0}}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:60}

/* ---------- modal ---------- */
.modal{position:absolute;inset:0;z-index:45;background:rgba(8,10,24,.6);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 64px) var(--gutr) calc(env(safe-area-inset-bottom,0px) + 16px) var(--gut);animation:fadein .25s}
.sheet{width:min(720px,100%);max-height:100%;overflow:auto;background:var(--glass);border:2px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:14px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:rise .3s ease-out;cursor:default}
.sheet h3{font-family:var(--f-kd);font-weight:400;font-size:1.6rem;margin:0;line-height:1.25}
.sheet .eyebrow{font-family:var(--f-logo);font-weight:700;color:var(--sun);letter-spacing:.08em;font-size:.8rem}
.sheet .foot{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;position:sticky;bottom:-22px;padding:12px 0 2px;background:linear-gradient(transparent,rgba(16,20,44,.95) 40%)}
.card{background:rgba(255,255,255,.06);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.card .en{font-size:1.12rem}
.result{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:baseline;font-family:var(--f-en);font-weight:700}
.result .s{font-family:var(--f-logo);background:var(--sun);color:var(--ink);border-radius:8px;padding:0 8px;margin-right:4px}
.hit{color:var(--mint)} .miss{color:var(--coral);text-decoration:underline wavy}
.note{font-size:.86rem;color:var(--muted);margin:0}
/* bulletin = paper */
.sheet.paper{background:var(--paper);color:var(--paper-ink);border:0;box-shadow:0 20px 50px rgba(0,0,0,.5);backdrop-filter:none}
.paper .church{font-family:var(--f-word);font-size:1.3rem;text-align:center;letter-spacing:.06em;font-variant:small-caps;margin:0}
.paper .when{font-family:var(--f-word);font-style:italic;text-align:center;color:#6B6658;margin:0}
.ow{list-style:none;margin:0;padding:0}
.ow li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 12px;padding:7px 0;border-bottom:1px dotted #C9C2AE;font-family:var(--f-word);font-size:1.02rem}
.ow li small{grid-column:1/-1;font-family:var(--f-ko);color:#7A7464;font-size:.82rem}
.ow li .r{font-style:italic;color:#7A7464;text-align:right;font-size:.92rem}
.ow li.hi{background:#FFF0C2;border-radius:8px;padding:7px 8px;margin:2px -8px}
.paper .gbtn{border-color:var(--paper-ink)}
/* tiles */
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:10px;border:2px dashed var(--line);border-radius:16px}
.tiles.ans{background:rgba(255,255,255,.06);border-style:solid}
.tile{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:5px 12px;font-family:var(--f-word);font-weight:500;font-size:1.12rem;box-shadow:0 3px 0 var(--ink);animation:pop .2s ease-out}
.ans .tile{background:var(--sun)}
.tile:disabled{opacity:.2;box-shadow:none;cursor:default}
.gloss{display:flex;flex-wrap:wrap;gap:6px}
.gloss span{background:rgba(255,255,255,.08);border:1.5px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.86rem}
.gloss b{font-family:var(--f-word);color:#FFE7A8}
.qa .q{font-family:var(--f-word);font-size:1.3rem;margin:0}
.qa .a{font-family:var(--f-word);font-style:italic;font-size:1.25rem;color:#FFE7A8;margin:0;letter-spacing:.01em}
.levels{display:flex;gap:6px;flex-wrap:wrap}
.lv{background:var(--glass-2);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.86rem}
.lv[aria-pressed="true"]{background:var(--sun);color:var(--ink);border-color:var(--sun)}
.lv.cleared::after{content:" ✓"}
blockquote{margin:0;font-family:var(--f-word);font-style:italic;font-size:1.05rem;line-height:1.5}
cite{display:block;font-style:normal;font-family:var(--f-logo);font-weight:600;color:var(--muted);font-size:.8rem;margin-top:2px}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.vocab button{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:8px 10px;text-align:left;box-shadow:0 3px 0 var(--ink);display:flex;flex-direction:column;gap:2px}
.vocab b{font-family:var(--f-en);font-weight:800;font-size:1rem}
.vocab small{color:#4A4F6B;font-size:.82rem}
/* item */
.item{display:flex;gap:16px;align-items:center}
.scroll{flex:0 0 74px;height:90px;border-radius:8px;background:var(--paper);border:3px solid var(--ink);position:relative;transform:rotate(-6deg);box-shadow:0 5px 0 var(--ink);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.scroll::before{content:"";position:absolute;inset:14px 12px auto;height:46px;background:repeating-linear-gradient(#B8B09A 0 3px,transparent 3px 10px)}
.scroll::after{content:"";position:absolute;left:24px;right:24px;top:6px;height:5px;background:#1F6B4F;border-radius:3px}
/* results */
.stamps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stamp{aspect-ratio:1;max-width:100%;border-radius:50%;border:4px double var(--sun);color:var(--sun);display:grid;place-items:center;text-align:center;font-family:var(--f-kd);font-size:.95rem;line-height:1.2;padding:6px;transform:rotate(-8deg);animation:stamp .45s cubic-bezier(.3,1.6,.5,1) both}
.stamp:nth-child(2){animation-delay:.15s;transform:rotate(6deg)}.stamp:nth-child(3){animation-delay:.3s;transform:rotate(-3deg)}.stamp:nth-child(4){animation-delay:.45s;transform:rotate(9deg)}
.stamp small{display:block;font-family:var(--f-logo);font-size:.62rem;letter-spacing:.06em}
@keyframes stamp{from{transform:scale(2) rotate(-25deg);opacity:0}}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:rgba(255,255,255,.06);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-logo);font-weight:700;font-size:1.6rem;color:var(--sun);font-variant-numeric:tabular-nums}
.stat span{font-size:.85rem;color:var(--muted)}
.menu-list{display:flex;flex-direction:column;gap:8px}
.menu-list button.chapbtn{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.06);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;text-align:left}
.menu-list button.chapbtn:disabled{opacity:.4;cursor:default}
.menu-list button.chapbtn b{font-family:var(--f-kd);font-weight:400;font-size:1.1rem}
.log{display:flex;flex-direction:column;gap:8px;max-height:40vh;overflow:auto}
.log div{border-left:3px solid var(--c,var(--line));padding-left:10px}
.log b{font-family:var(--f-logo);font-size:.82rem;color:var(--c,var(--muted))}
.log p{margin:0}
.set{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.set select{background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:4px 8px}

/* ---------- title ---------- */
#title{position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 20px) var(--gutr) calc(env(safe-area-inset-bottom,0px) + 24px) var(--gut);
  background:linear-gradient(180deg,rgba(11,14,32,0) 0%,rgba(11,14,32,.2) 35%,rgba(11,14,32,.92) 75%),url("img/bg-entrance.jpg") center/cover}
.tbox{width:min(560px,100%);display:flex;flex-direction:column;gap:14px;align-items:stretch}
.logo{font-family:var(--f-logo);font-weight:700;font-size:clamp(2.6rem,10vw,4.4rem);line-height:.95;margin:0;text-align:center;color:#fff;
  text-shadow:0 4px 0 var(--ink),0 8px 0 rgba(20,24,51,.45);letter-spacing:-.01em;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.logo span{color:var(--sun)}

<script>
/* ================= data ================= */

/* listen → type or speak it back → word-by-word score */

/* ================= stage: bg & sprites ================= */

}

/* ================= dialogue box ================= */

  const nextWeek = WEEKS.find(w => w.id === W.id + 1);
  modal(h("div", {class:"sheet"},
    h("p", {class:"eyebrow"}, W.title.toUpperCase() + " · CLEAR!"), h("h3", {}, `수고했어요, ${nm()}!`),
    h("p", {class:"note"}, "점수는 실력을 재는 도구일 뿐이에요. 우리를 받아 주시는 건 은혜예요. 오늘 배운 문답처럼, 우리는 하나님을 즐거워하려고 배워요."),
    h("div", {class:"stamps"}, chs.map(c => h("div", {class:"stamp", style: S.reached.includes(c.id) ? null : "opacity:.25"}, h("span", {}, h("small", {}, "STEP " + c.n), c.title)))),
    h("div", {class:"stats"},
      h("div", {class:"stat"}, h("b", {}, `Lv.${li+1}`), h("span", {}, `${LEVELS[li][1]} · ${S.xp} XP`)),
      h("div", {class:"stat"}, h("b", {}, `${firstBest}/${choiceKeys.length}`), h("span", {}, "첫 시도에 PERFECT")),
      h("div", {class:"stat"}, h("b", {}, `${qv.filter(Boolean).length}/${qv.length}`), h("span", {}, "설교 퀴즈 정답")),
      h("div", {class:"stat"}, h("b", {}, `${S.recite}점`), h("span", {}, `소요리문답 암송 · 최고 콤보 ${S.bestCombo}`))),
    h("div", {class:"card"}, h("p", {class:"eyebrow"}, "NEXT LORD'S DAY"), h("p", {style:"margin:0;font-family:var(--f-kd);font-size:1.15rem"}, nextWeek ? nextWeek.title + " · " + nextWeek.sub : (W.teaser || "다음 주 준비 중")), h("p", {class:"note"}, nextWeek ? "지금 시작할 수 있어요." : "곧 열려요.")),
    h("div", {class:"foot"},
      btn("이 주 다시 하기", () => { closeModal(); restartWeek(); }, "gbtn ghost"),
      nextWeek ? btn(nextWeek.title + " 시작 ▶", () => { closeModal(); S.week = nextWeek.id; W = nextWeek; restartWeek(); }, "gbtn mint") : btn("타이틀로", () => { closeModal(); showTitle(); }, "gbtn mint"))));
}
function restartWeek(){
  const keep = {name:S.name, rate:S.rate, sfx:S.sfx, showKo:S.showKo, hideEn:S.hideEn, week:S.week, xp:S.xp, awarded:S.awarded, started:true};
  S = Object.assign(fresh(), keep); save();
  $("bottom").hidden = false; rebuildTo(0); run();
}

/* ---------- menu ---------- */
function openMenu(){
  const prevMode = mode; mode = "overlay"; stopVoice();
  const back = () => { closeModal(); mode = prevMode; };
  let confirmReset = false;
  const sheet = h("div", {class:"sheet"});
  const draw = () => sheet.replaceChildren(
    h("p", {class:"eyebrow"}, "MENU · " + W.title.toUpperCase()), h("h3", {}, "메뉴"),
    h("div", {class:"menu-list"}, chapters().map(c => h("button", {type:"button", class:"chapbtn", disabled: !S.reached.includes(c.id), onclick:() => { closeModal(); rebuildTo(c.i); run(); }},
      h("span", {}, h("b", {}, `${c.n}. ${c.title}`), " ", h("span", {class:"note"}, c.en)), S.reached.includes(c.id) ? "이동 ▶" : "잠김"))),
    S.items.includes("bulletin") ? btn("주보 다시 보기", () => openOverlay("bulletin", {}, () => openMenu()), "gbtn ghost") : null,
    h("div", {class:"set"}, h("label", {for:"rate"}, "음성 속도"),
      h("select", {id:"rate", onchange:e => { S.rate = +e.target.value; save(); }}, [[0.85,"천천히"],[1,"보통"],[1.15,"빠르게"]].map(([v,l]) => h("option", {value:v, selected: S.rate === v ? true : null}, l))),
      btn(S.sfx ? "효과음 켬" : "효과음 끔", () => { S.sfx = !S.sfx; save(); draw(); }, "mini")),
    h("p", {class:"eyebrow"}, "대화 기록"),
    h("div", {class:"log"}, S.log.slice(-40).reverse().map(l => { const p = l.who ? speakerInfo(l.who) : null; return h("div", {style: p ? `--c:${p.color}` : null},
      h("b", {}, p ? p.name : "내레이션"), l.en ? h("div", {class:"row"}, h("p", {class:"en", style:"font-size:1rem;flex:1 1 200px"}, l.en), btn(h("span", {html:ICON.play}), () => play(l.en, (W.cast[l.who] || {}).voice || "m"), "mini", {"aria-label":"듣기"})) : null,
      l.ko ? h("p", {class:"ko"}, l.ko) : null); })),
    h("div", {class:"foot"},
      btn(confirmReset ? "정말 처음부터? 한 번 더 누르기" : "이 주 처음부터", () => { if (!confirmReset) { confirmReset = true; draw(); return; } closeModal(); restartWeek(); }, "gbtn ghost"),
      btn("타이틀로", () => { closeModal(); showTitle(); }, "gbtn ghost"),
      btn("닫기", back, "gbtn mint")));
  draw(); modal(sheet);
}

/* ---------- title ---------- */
function showTitle(){
  stopVoice(); closeModal(); mode = "title";
  $("hud").hidden = true; $("bottom").hidden = true; hideSprite("all");
  const t = $("title"); t.hidden = false;
  const input = h("input", {class:"field", id:"name", type:"text", value:S.name, placeholder:"영어 이름 (예: Joseph)", autocomplete:"given-name", maxlength:"24", oninput:e => { S.name = e.target.value; save(); }});
  const resume = S.started && S.pos > 0;
  t.replaceChildren(h("div", {class:"tbox"},
    h("h1", {class:"logo"}, "Lord's Day", h("br"), h("span", {}, "English")),
    h("p", {class:"tagline"}, "주일 아침, 영어로 교회 가기"),
    h("div", {class:"weeks"}, WEEKS.map(w => h("button", {type:"button", class:"week", "aria-pressed":String(w.id === S.week), onclick:() => { if (w.id !== S.week) { S.week = w.id; W = w; S.pos = 0; S.started = false; save(); } showTitle(); }},
      h("b", {}, w.title), h("small", {}, w.sub))),
      h("button", {type:"button", class:"week", disabled:true}, h("b", {}, "Lord's Day " + (WEEKS.length + 1)), h("small", {}, "준비 중"))),
    h("div", {class:"namerow"}, h("label", {for:"name"}, "영어 이름"), input),
    h("div", {class:"namerow"},
      btn(resume ? "이어하기 ▶" : "교회로 출발 ▶", () => start(false), "gbtn mint bigbtn"),
      resume ? btn("처음부터", () => start(true), "gbtn ghost bigbtn") : null),
    h("p", {class:"note", style:"text-align:center;color:#fff"}, "소리를 켜 주세요 · 화면을 누르거나 Space로 넘겨요")));
}
function start(over){
  if (!S.name.trim()) S.name = "Joseph";
  $("title").hidden = true; $("hud").hidden = false; $("bottom").hidden = false;
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); } catch {}
  if (over || !S.started) { const keep = {name:S.name, rate:S.rate, sfx:S.sfx, showKo:S.showKo, hideEn:S.hideEn, week:S.week, xp:S.xp, awarded:S.awarded}; S = Object.assign(fresh(), keep, {started:true}); save(); rebuildTo(0); }
  else rebuildTo(rewindPos(S.pos));
  run();
}
/* resume at the nearest beat that can render by itself */
function rewindPos(p){ while (p > 0 && ["show","hide","bg","auto"].includes(W.script[p].t)) p--; return p; }

/* ---------- input ---------- */
$("stage").addEventListener("click", e => {
  if (e.target.closest("button, input, select, label, .modal, .hud, .toast, .banner, #title")) return;
  advance();
});
document.addEventListener("keydown", e => {
  if (e.target.matches && e.target.matches("input, select, textarea")) return;
  if (e.key === " " || e.key === "Enter") { if (mode === "typing" || mode === "wait") { e.preventDefault(); advance(); } }
  if (/^[1-4]$/.test(e.key) && (mode === "choice")) { const b = $("choices").querySelectorAll("button.choice")[+e.key - 1]; if (b && !b.disabled) b.click(); }
});

/* preload pictures so scene changes are instant */
for (const w of WEEKS) { Object.values(w.bgs).forEach(u => { const i = new Image(); i.src = u; }); Object.values(w.cast).forEach(c => { const i = new Image(); i.src = c.img; }); }
showTitle();
/* web app build only: offline cache (the artifact page has no service worker) */
if (!IN_CLAUDE && "serviceWorker" in navigator && document.querySelector('link[rel="manifest"]')) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
